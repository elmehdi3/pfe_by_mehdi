apiVersion: apps/v1
kind: Deployment
metadata:
  name: matchmaker-backend
  labels:
    app: matchmaker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: matchmaker
  template:
    metadata:
      labels:
        app: matchmaker
    spec:
      containers:
      - name: matchmaker-api
        image: matchmaker-backend:latest
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: prod
        - name: SPRING_DATASOURCE_URL
          valueFrom:
            configMapKeyRef:
              name: matchmaker-config
              key: db_url
        resources:
          limits:
            cpu: "1"
            memory: "1Gi"
          requests:
            cpu: "500m"
            memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: matchmaker-service
spec:
  selector:
    app: matchmaker
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: LoadBalancer
