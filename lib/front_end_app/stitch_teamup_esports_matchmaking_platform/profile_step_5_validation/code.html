<div class="fixed bottom-0 right-0 w-[60vw] h-[353px] bg-secondary-container/10 rounded-full blur-[100px] pointer-events-none z-0"></div>
<!-- 100% Progress Bar Container (Top Edge) -->
<div class="fixed top-0 left-0 w-full h-1 bg-surface-container-highest z-50">

<div class="h-full w-full bg-primary shadow-[0_0_15px_rgba(210,187,255,1)]"></div>
</div>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col relative z-10 w-full max-w-lg mx-auto px-margin-mobile pt-lg pb-md md:px-margin-desktop md:pt-xl justify-center h-screen">
<!-- Header Text -->

<h1 class="font-display-lg-mobile text-display-lg-mobile md:font-display-lg md:text-display-lg text-primary drop-shadow-[0_0_10px_rgba(210,187,255,0.4)] mb-xs">

<p class="font-body-md text-body-md text-on-surface-variant">
                Your dossier is complete. Review before deployment.
            </p>
</header>
<!-- Profile Summary Card (Glassmorphism & Luminous Depth) -->
<div class="relative w-full bg-surface/60 backdrop-blur-2xl rounded-xl border border-outline-variant/50 shadow-[0_8px_32px_rgba(0,0,0,0.5)] p-md flex flex-col items-center mb-lg">
<!-- Beveled glass edge effect -->
<div class="absolute inset-0 rounded-xl pointer-events-none border-t border-white/10" style="background: linear-gradient(180deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0) 20%);"></div>
<!-- Avatar & Status -->
<div class="relative mt-sm mb-md">
<!-- Avatar Outer Glow/Ring -->
<div class="w-32 h-32 rounded-full p-1 bg-gradient-to-br from-primary via-inverse-primary to-surface-container-highest shadow-[0_0_25px_rgba(124,58,237,0.3)]">

</div>
<!-- Status Badge -->
<div class="absolute -bottom-2 right-2 bg-tertiary text-on-tertiary font-label-caps text-label-caps px-3 py-1 rounded-full shadow-[0_0_10px_rgba(74,225,118,0.4)] border border-tertiary-fixed flex items-center gap-xs">
<span class="w-2 h-2 rounded-full bg-on-tertiary animate-pulse"></span> ONLINE
                </div>
</div>
<!-- Identity Info -->
<h2 class="font-headline-md text-headline-md text-on-surface mb-xs text-center flex items-center gap-xs">
                @VoidWalker
                <span class="material-symbols-outlined text-primary text-[20px]" style="font-variation-settings: 'FILL' 1;">verified</span>
</h2>
<!-- Main Game Badge -->
<div class="flex items-center gap-xs bg-surface-container-highest/50 border border-outline-variant rounded-full px-4 py-1.5 mb-md backdrop-blur-md">
<span class="material-symbols-outlined text-primary text-[18px]">sports_esports</span>
<span class="font-label-caps text-label-caps text-on-surface-variant">VALORANT MAIN</span>
</div>
<!-- Key Stats Bento Grid -->
<div class="w-full grid grid-cols-3 gap-sm mt-xs">
<!-- Stat Block 1 -->
<div class="bg-surface-container-lowest/80 border border-white/5 rounded-lg p-sm flex flex-col items-center justify-center relative overflow-hidden group">

<span class="font-stats-number text-stats-number text-primary drop-shadow-[0_0_8px_rgba(210,187,255,0.6)]">1.48</span>
</div>
<!-- Stat Block 2 -->
<div class="bg-surface-container-lowest/80 border border-white/5 rounded-lg p-sm flex flex-col items-center justify-center relative overflow-hidden group">
<div class="absolute inset-0 bg-secondary/0 group-hover:bg-secondary/5 transition-colors duration-300 pointer-events-none"></div>
<span class="font-label-caps text-label-caps text-on-surface-variant mb-xs">WIN RATE</span>
<span class="font-stats-number text-stats-number text-on-surface">62%</span>
</div>
