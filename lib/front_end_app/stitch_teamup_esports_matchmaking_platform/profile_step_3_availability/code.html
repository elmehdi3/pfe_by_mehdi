<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Profile Creation - Availability</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;family=Sora:wght@600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-container-highest": "#2d3449",
                        "outline-variant": "#4a4455",
                        "secondary-fixed-dim": "#b4c5ff",
                        "error-container": "#93000a",
                        "surface-bright": "#31394d",
                        "primary-container": "#7c3aed",
                        "error": "#ffb4ab",
                        "secondary": "#b4c5ff",
                        "on-surface": "#dae2fd",
                        "surface-variant": "#2d3449",
                        "on-error": "#690005",
                        "on-secondary-fixed": "#00174b",
                        "on-tertiary": "#003915",
                        "surface": "#0b1326",
                        "on-tertiary-fixed": "#002109",
                        "surface-container-low": "#131b2e",
                        "on-primary-container": "#ede0ff",
                        "secondary-container": "#0053db",
                        "on-tertiary-container": "#84ff9c",
                        "inverse-primary": "#732ee4",
                        "outline": "#958da1",
                        "inverse-on-surface": "#283044",
                        "on-background": "#dae2fd",
                        "surface-container-high": "#222a3d",
                        "on-surface-variant": "#ccc3d8",
                        "on-primary": "#3f008e",
                        "on-secondary-container": "#cdd7ff",
                        "on-primary-fixed-variant": "#5a00c6",
                        "surface-container-lowest": "#060e20",
                        "surface-container": "#171f33",
                        "inverse-surface": "#dae2fd",
                        "on-tertiary-fixed-variant": "#005321",
                        "tertiary": "#4ae176",
                        "background": "#0b1326",
                        "on-primary-fixed": "#25005a",
                        "tertiary-fixed": "#6bff8f",
                        "tertiary-container": "#007733",
                        "on-secondary": "#002a78",
                        "secondary-fixed": "#dbe1ff",
                        "primary-fixed-dim": "#d2bbff",
                        "on-secondary-fixed-variant": "#003ea8",
                        "surface-tint": "#d2bbff",
                        "surface-dim": "#0b1326",
                        "on-error-container": "#ffdad6",
                        "primary-fixed": "#eaddff",
                        "primary": "#d2bbff",
                        "tertiary-fixed-dim": "#4ae176"
                    },
                    borderRadius: {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    spacing: {
                        "base": "8px",
                        "xl": "80px",
                        "margin-desktop": "64px",
                        "gutter": "24px",
                        "xs": "4px",
                        "md": "24px",
                        "sm": "12px",
                        "margin-mobile": "16px",
                        "lg": "48px"
                    },
                    fontFamily: {
                        "headline-md": ["Sora", "sans-serif"],
                        "body-md": ["Inter", "sans-serif"],
                        "label-caps": ["Inter", "sans-serif"],
                        "display-lg": ["Sora", "sans-serif"],
                        "body-lg": ["Inter", "sans-serif"],
                        "display-lg-mobile": ["Sora", "sans-serif"],
                        "stats-number": ["Sora", "sans-serif"]
                    },
                    fontSize: {
                        "headline-md": ["24px", { lineHeight: "1.3", fontWeight: "600" }],
                        "body-md": ["16px", { lineHeight: "1.5", fontWeight: "400" }],
                        "label-caps": ["12px", { lineHeight: "1", letterSpacing: "0.1em", fontWeight: "700" }],
                        "display-lg": ["48px", { lineHeight: "1.1", letterSpacing: "-0.04em", fontWeight: "800" }],
                        "body-lg": ["18px", { lineHeight: "1.6", fontWeight: "400" }],
                        "display-lg-mobile": ["32px", { lineHeight: "1.2", letterSpacing: "-0.02em", fontWeight: "800" }],
                        "stats-number": ["20px", { lineHeight: "1", fontWeight: "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .glass-panel {
            background: rgba(45, 52, 73, 0.4);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-top: 1px solid rgba(255, 255, 255, 0.15);
        }
        .glow-active {
            box-shadow: 0 0 20px rgba(124, 58, 237, 0.4);
            border-color: rgba(210, 187, 255, 0.6);
        }
        .progress-gradient {
            background: linear-gradient(90deg, #7c3aed 0%, #0053db 100%);
        }
        .btn-primary {
            background: linear-gradient(135deg, #7c3aed 0%, #0053db 100%);
        }
        .btn-primary:hover {
            box-shadow: 0 0 24px rgba(124, 58, 237, 0.6);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface min-h-screen flex flex-col font-body-md overflow-x-hidden selection:bg-primary-container selection:text-on-primary-container">
<!-- Top Navigation for Transactional Flow (Close/Back) -->
<header class="flex justify-between items-center h-16 px-margin-mobile md:px-margin-desktop w-full fixed top-0 z-50 glass-panel">
<button class="text-on-surface-variant hover:text-primary transition-colors flex items-center justify-center p-2 rounded-full">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<div class="font-headline-md text-headline-md font-extrabold text-primary tracking-tighter">
            TEAMUP
        </div>
<button class="text-on-surface-variant hover:text-primary transition-colors flex items-center justify-center p-2 rounded-full">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
</header>
<main class="flex-grow pt-[80px] pb-lg px-margin-mobile md:px-margin-desktop flex flex-col items-center max-w-4xl mx-auto w-full">
<!-- Progress Indicator -->
<div class="w-full max-w-md mb-md">
<div class="flex justify-between items-center mb-sm">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase">Step 3 of 5</span>
<span class="font-label-caps text-label-caps text-primary uppercase">60%</span>
</div>
<div class="h-2 w-full bg-surface-container rounded-full overflow-hidden">
<div class="h-full progress-gradient rounded-full w-[60%]"></div>
</div>
</div>
<!-- Header -->
<div class="text-center mb-lg">
<h1 class="font-display-lg-mobile text-display-lg-mobile md:font-display-lg md:text-display-lg mb-sm text-on-surface">When do you play?</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-lg mx-auto">Set your availability to find squadmates online when you are. You can always adjust this later.</p>
</div>
<!-- Main Content Area -->
<div class="w-full grid grid-cols-1 md:grid-cols-2 gap-gutter">
<!-- Days Selection (Left Column) -->
<div class="glass-panel rounded-xl p-md flex flex-col gap-md">
<h2 class="font-headline-md text-headline-md text-primary flex items-center gap-sm">
<span class="material-symbols-outlined">calendar_today</span>
                    Active Days
                </h2>
<div class="grid grid-cols-7 gap-xs mt-sm">
<!-- Day Toggles -->
<button class="flex flex-col items-center justify-center py-sm rounded-lg bg-surface-container-high hover:bg-surface-container-highest transition-colors text-on-surface-variant">
<span class="font-label-caps text-label-caps">M</span>
</button>
<button class="flex flex-col items-center justify-center py-sm rounded-lg glass-panel glow-active text-primary">
<span class="font-label-caps text-label-caps">T</span>
</button>
<button class="flex flex-col items-center justify-center py-sm rounded-lg glass-panel glow-active text-primary">
<span class="font-label-caps text-label-caps">W</span>
</button>
<button class="flex flex-col items-center justify-center py-sm rounded-lg bg-surface-container-high hover:bg-surface-container-highest transition-colors text-on-surface-variant">
<span class="font-label-caps text-label-caps">T</span>
</button>
<button class="flex flex-col items-center justify-center py-sm rounded-lg glass-panel glow-active text-primary">
<span class="font-label-caps text-label-caps">F</span>
</button>
<button class="flex flex-col items-center justify-center py-sm rounded-lg glass-panel glow-active text-primary">
<span class="font-label-caps text-label-caps">S</span>
</button>
<button class="flex flex-col items-center justify-center py-sm rounded-lg glass-panel glow-active text-primary">
<span class="font-label-caps text-label-caps">S</span>
</button>
</div>
<div class="mt-md pt-md border-t border-white/10">
<label class="flex flex-col gap-sm">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase">Average Play Time</span>
<div class="flex items-center gap-sm">
<span class="font-stats-number text-stats-number text-primary w-12 text-right">3h</span>
<input class="w-full h-1 bg-surface-container rounded-full appearance-none outline-none [&amp;::-webkit-slider-thumb]:appearance-none [&amp;::-webkit-slider-thumb]:w-4 [&amp;::-webkit-slider-thumb]:h-4 [&amp;::-webkit-slider-thumb]:bg-primary [&amp;::-webkit-slider-thumb]:rounded-full [&amp;::-webkit-slider-thumb]:cursor-pointer [&amp;::-webkit-slider-thumb]:shadow-[0_0_10px_rgba(210,187,255,0.8)]" max="12" min="1" type="range" value="3"/>
</div>
</label>
</div>
</div>
<!-- Time Ranges (Right Column) -->
<div class="glass-panel rounded-xl p-md flex flex-col gap-md">
<h2 class="font-headline-md text-headline-md text-primary flex items-center gap-sm">
<span class="material-symbols-outlined">schedule</span>
                    Time Ranges
                </h2>
<div class="grid grid-cols-1 gap-sm mt-sm">
<!-- Morning -->
<button class="flex items-center justify-between p-sm rounded-lg bg-surface-container-high hover:bg-surface-container-highest transition-colors border border-transparent">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined">wb_twilight</span>
</div>
<div class="text-left">
<div class="font-body-md text-body-md font-bold text-on-surface">Morning</div>
<div class="font-label-caps text-label-caps text-on-surface-variant mt-xs">06:00 - 12:00</div>
</div>
</div>
<div class="w-6 h-6 rounded border border-outline-variant flex items-center justify-center"></div>
</button>
<!-- Afternoon -->
<button class="flex items-center justify-between p-sm rounded-lg bg-surface-container-high hover:bg-surface-container-highest transition-colors border border-transparent">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined">light_mode</span>
</div>
<div class="text-left">
<div class="font-body-md text-body-md font-bold text-on-surface">Afternoon</div>
<div class="font-label-caps text-label-caps text-on-surface-variant mt-xs">12:00 - 18:00</div>
</div>
</div>
<div class="w-6 h-6 rounded border border-outline-variant flex items-center justify-center"></div>
</button>
<!-- Evening (Selected) -->
<button class="flex items-center justify-between p-sm rounded-lg glass-panel glow-active">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-primary/20 flex items-center justify-center text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">bedtime</span>
</div>
<div class="text-left">
<div class="font-body-md text-body-md font-bold text-primary">Evening</div>
<div class="font-label-caps text-label-caps text-primary/80 mt-xs">18:00 - 00:00</div>
</div>
</div>
<div class="w-6 h-6 rounded bg-primary flex items-center justify-center text-on-primary">
<span class="material-symbols-outlined text-[16px] font-bold">check</span>
</div>
</button>
<!-- Night -->
<button class="flex items-center justify-between p-sm rounded-lg bg-surface-container-high hover:bg-surface-container-highest transition-colors border border-transparent">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined">clear_night</span>
</div>
<div class="text-left">
<div class="font-body-md text-body-md font-bold text-on-surface">Night</div>
<div class="font-label-caps text-label-caps text-on-surface-variant mt-xs">00:00 - 06:00</div>
</div>
</div>
<div class="w-6 h-6 rounded border border-outline-variant flex items-center justify-center"></div>
</button>
</div>
</div>
</div>
<!-- Action Buttons -->
<div class="w-full max-w-md mt-xl flex flex-col sm:flex-row gap-sm justify-center">
<button class="px-xl py-sm rounded-lg font-body-md text-body-md font-bold text-on-surface glass-panel hover:bg-surface-container-highest transition-colors w-full sm:w-auto">
                Skip for now
            </button>
<button class="px-xl py-sm rounded-lg font-body-md text-body-md font-bold text-white btn-primary transition-all w-full sm:w-auto flex items-center justify-center gap-sm">
                Continue
                <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</main>
</body></html>
