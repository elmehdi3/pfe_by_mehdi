apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "matchmaker-backend.fullname" . }}
  labels:
    {{- include "matchmaker-backend.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "matchmaker-backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "matchmaker-backend.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.env.springProfile }}
            - name: SPRING_DATASOURCE_URL
              value: {{ .Values.env.dbUrl }}
            - name: SPRING_DATA_REDIS_HOST
              value: {{ .Values.env.redisHost }}
            - name: SPRING_RABBITMQ_HOST
              value: {{ .Values.env.rabbitmqHost }}
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
