spring:
  datasource:
    url: jdbc:mysql://localhost:3306/matchmaker_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus,env,beans"
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: matchmaker-gaming

matchmaker:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expirationMs: 86400000 # 24 hours
    refreshExpirationMs: 604800000 # 7 days

aws:
  accessKey: ${AWS_ACCESS_KEY:dummy-access-key}
  secretKey: ${AWS_SECRET_KEY:dummy-secret-key}
  region: ${AWS_REGION:eu-west-1}
  s3:
    endpoint: ${AWS_S3_ENDPOINT:}
