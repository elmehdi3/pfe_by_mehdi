user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    upstream backend_servers {
        server app:8080;
    }

    server {
        listen 80;
        server_name api.matchmakergaming.com;

        # Redirection vers HTTPS en production
        # return 301 https://$host$request_uri;

        location / {
            proxy_pass http://backend_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Configuration spécifique pour les WebSockets
        location /ws {
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;

            proxy_read_timeout 86400; # Garder la connexion ouverte
        }

        # Endpoints Actuator (Monitoring) - Restreindre l'accès en prod
        location /actuator {
            proxy_pass http://backend_servers;
            # allow 10.0.0.0/8; # Exemple d'IP interne
            # deny all;
        }
    }
}
